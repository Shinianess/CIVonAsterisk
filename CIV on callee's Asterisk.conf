CIV on callee 's Asterisk

[Please copy the below code in extensions.conf]


[civ]
include => civ-verify
include => civ_forwarding

;================================ CIV-callee ==================================

;--------------------------- Normal CIV ------------------------
[civ-initial]

[civ-verify]
exten=>392231,1,Verbose(2,CIV Detection Start)
;	same=>n,Verbose(1,civStart:${STRFTIME(,,%Y-%m-%d %H:%M:%S.%3q)})
        ; Get caller info
        same=>n,Set(__caller_num=${CALLERID(num)})
        same=>n,Set(__caller_full=${CALLERID(all)})
        

	; Read the Supported header to check for CIV support (standard method)
        same=>n,Set(supported=${PJSIP_HEADER(read,Supported)})
        same=>n,Set(has_civ_header=${REGEX("civ" ${supported} i)})
       ; same=>n,Verbose(1, Supported header: ${supported})
        ; Trigger CIV only if the standard Supported header contains "civ"
         same=>n,GotoIf($[${has_civ_header} = 1]?civ_detected:normal_route)

         same => n(normal_route),Verbose(2,Normal routing)
	same=>n,Verbose(1,*CIV is Unsuported) 
        same => n,Set(CALLERID(name)=Unverified Caller ID)
	same=>n,Verbose(1,*Connecting to callee's endpoint...)
         same => n,Dial(PJSIP/${EXTEN})
         same => n,Hangup()

         same => n(civ_detected),Verbose(2,CIV detected in ${caller_full})
        same=>n,Verbose(1,civ_Start:${STRFTIME(,,%Y-%m-%d %H:%M:%S.%3q)})
	 same=>n,Answer(,i)
	;same=>n,Verbose(1,civAnswer:${STRFTIME(,,%Y-%m-%d %H:%M:%S.%3q)})
        same=>n,StartMusicOnHold(default)
         ; Retrieve the initial session ID from the incoming call's Session-ID header
        same=>n,Set(initial_full_session=${PJSIP_HEADER(read,Session-ID)})
        same=>n,Set(__initial_session_id=${CUT(initial_full_session,\;,1)})  ; part before semicolon   

         ; Set callback code
         same => n,Set(callback_cid=${RAND(1000,9999)})
	 ;same => n,Set(random_num=${RAND(0,9999)})
         ; Ensure the length of generated number is 4 
         ;same => n,Set(callback_cid=${IF($[${LEN(${random_num})} = 4]?${random_num}:${IF($[${LEN(${random_num})} = 3]?0${random_num}:${IF($[${LEN(${random_num})} = 2]?00${random_num}:${IF($[${LEN(${random_num})} = 1]?000${random_num}:1000)})})})})
         same => n,Verbose(2, Random number: ${callback_cid}) 
	 same => n,Set(callback_target=verficall)

        ;Start callback call
        ; Generate a new session ID for the verification call itself
        same=>n,Set(__verif_session_id=${REPLACE(UUID(),-,)})
        ; Set the caller ID to the challenge (last four digits of our number)
        same=>n,Set(CALLERID(num)=${callback_cid})
        ; Add the CIV verification headers
        ; Start the verification call (quickly terminated)
	same=>n,Verbose(1,verify_Callback:${STRFTIME(,,%Y-%m-%d %H:%M:%S.%3q)})
        same=>n,Dial(PJSIP/${callback_target}@serverfr,1,b(civ_callback^s^1))
        ;Retrive code from DTMF
        same=>n,Read(DTMF,,,,,2);Default timeout is 2s, the application ends with # received.
        same=>n,Verbose(1,DTMF_rec:${STRFTIME(,,%Y-%m-%d %H:%M:%S.%3q)})
        same=>n,Verbose(1,*Recieved_code:${DTMF})
	;Matching and result display
        same=>n,Execif($["${callback_cid}" = "${DTMF}"]?Set(verify_result=Verified Caller ID):Set(verify_result=Unverified Caller ID))
        same=>n,Set(CALLERID(num)=${caller_num})
        same=>n,Set(CALLERID(name)=${verify_result})
	same=>n,Verbose(1,civ_End:${STRFTIME(,,%Y-%m-%d %H:%M:%S.%3q)})
        same=>n,Verbose(1,*Connecting to callee's endpoint...)
	same=>n,Dial(PJSIP/${EXTEN})
        same => n,Hangup()
[civ_callback]
exten=>s,1,Set(PJSIP_HEADER(add,Call-Info)=<sip:${caller_full}>\;purpose=civ-veri-call)
        same=>n,Set(PJSIP_HEADER(add,Session-ID)=${verif_session_id}\;remote=${initial_session_id}) 
        same=>n,Return()

;---------------------------------- Legitimate spoofing with call forwarding enabled --------------------

[civ_forwarding]
exten => 3922800,1,Verbose(1,*Incoming call from ${CALLERID(num)})
    ; Save the original caller's full identification (display name, number, and SIP URI)
   ; same => n,Set(__original_caller_all=${CALLERID(all)})
    ; Read the CIV-related SIP headers from the original request
    same => n,Set(__original_supported=${PJSIP_HEADER(read,Supported)})
    same => n,Set(__original_session=${PJSIP_HEADER(read,Session-ID)})

    ; Use the 'b' option to add the copied headers on the outbound channel and set the caller ID
    same => n,Dial(PJSIP/3922700@serversg,,b(forward_civ_add^s^1))
    same => n,Hangup()

[forward_civ_add]
exten => s,1,Verbose(1,*Adding CIV headers and Caller ID to forwarded call)
    ; Copy the original Supported header to the outbound INVITE
    same => n,Set(PJSIP_HEADER(add,Supported)=${original_supported})
    ; Copy the original Session-ID header to the outbound INVITE
    same => n,Set(PJSIP_HEADER(add,Session-ID)=${original_session})
    ; Keep the caller identification identical to the original call (name, number, and SIP URI)
   ; same => n,Set(CALLERID(all)=${original_caller_all})
    same => n,Return()
;===================================== End ==========================================
